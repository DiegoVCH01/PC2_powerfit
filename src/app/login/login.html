<div class="login-page">
  <div class="login-card">
    <h2 class="login-title">💪 PowerFit</h2>
    <p class="login-subtitle">Iniciar Sesión</p>

    <div *ngIf="mensajeError" class="alert alert-danger text-center">
      {{ mensajeError }}
    </div>

    <form (ngSubmit)="iniciarSesion()">
      <div class="mb-4">
        <label class="form-label">Correo Electrónico</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="usuario"
          name="usuario"
          placeholder="tu@email.com"
        />
      </div>

      <div class="mb-4">
        <label class="form-label">Contraseña</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="clave"
          name="clave"
          placeholder="••••••••"
        />
      </div>

      <button type="submit" class="btn btn-login w-100">Ingresar</button>
    </form>
  </div>
</div>
